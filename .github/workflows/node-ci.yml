
name: Node.js CI Pipeline

# Trigger workflow
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Permissions
permissions:
  contents: read

# Jobs
jobs:
  build:
    name: Node.js Build and Test
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Check Node.js and npm versions
      - name: Check Node and npm versions
        run: |
          echo "Node.js Version:"
          node -v

          echo "NPM Version:"
          npm -v

      # Step 4: Inspect repository files
      - name: Inspect repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "JavaScript files:"
          find . -type f -name "*.js" \
            -not -path "./node_modules/*"

      # Step 5: Install dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Step 6: Validate JavaScript syntax
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          mapfile -t JS_FILES < <(
            find . -type f -name "*.js" \
              -not -path "./node_modules/*"
          )

          if [ "${#JS_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No JavaScript files found!"
            exit 1
          fi

          for file in "${JS_FILES[@]}"; do
            echo "Checking: $file"
            node --check "$file"
          done

          echo "JavaScript syntax validation successful!"

      # Step 7: Run automated tests
      - name: Run automated tests
        run: npm test

      # Step 8: Pipeline completion
      - name: CI Pipeline Completed
        run: |
          echo "================================"
          echo "Node.js CI Pipeline Successful!"
          echo "================================"
